name: Update Streak Stats

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create assets directory
        run: mkdir -p assets
        
      - name: Download Streak Stats
        run: |
          curl -L -o assets/streak-stats.svg "https://streak-stats.demolab.com?user=stevenuuang&theme=tokyonight&hide_border=true&border_radius=10"
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Update streak stats" && git push)
